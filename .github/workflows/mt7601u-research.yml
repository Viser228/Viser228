name: MT7601U experimental driver build

on:
  push:
    paths:
      - '.github/workflows/mt7601u-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Disk space and dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev dwarves cpio rsync clang lld llvm gcc-aarch64-linux-gnu
          df -h .

      - name: Fetch historical GKID kernel source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch GKID-NH https://github.com/ahmed-alnassif/GKI-Duchamp-6.1.git kernel
          cd kernel
          git fetch --depth=1 origin e3b8fb598ad4e5ec0e2321e66090590882f43147
          git checkout --detach e3b8fb598ad4e5ec0e2321e66090590882f43147
          git submodule update --init --depth=1 || true
          printf 'Source SHA: '; git rev-parse HEAD

      - name: Configure MT7601U as module
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cd kernel
          make O="${GITHUB_WORKSPACE}/out" ARCH=arm64 LLVM=1 gki_defconfig
          ./scripts/config --file "${GITHUB_WORKSPACE}/out/.config" \
            -e USB -e WLAN -e WLAN_VENDOR_MEDIATEK \
            -m CFG80211 -m MAC80211 -m MT7601U
          make O="${GITHUB_WORKSPACE}/out" ARCH=arm64 LLVM=1 olddefconfig
          grep -E '^(CONFIG_(MT7601U|MAC80211|CFG80211|MODVERSIONS|CFI_CLANG)=)' "${GITHUB_WORKSPACE}/out/.config"
          grep -q '^CONFIG_MT7601U=m$' "${GITHUB_WORKSPACE}/out/.config"

      - name: Compile kernel exports and Wi-Fi modules
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          make O="${GITHUB_WORKSPACE}/out" ARCH=arm64 LLVM=1 -j3 Image modules 2>&1 | tee "${GITHUB_WORKSPACE}/compile.log"
          test -s "${GITHUB_WORKSPACE}/out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko"

      - name: Inspect experimental module (never auto-flash)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          cp out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko results/
          cp out/.config results/build-config
          {
            uname -a
            echo "TARGET_DEVICE: duchamp; USB ID: 148f:7601"
            echo "REFERENCE_RUNNING_KERNEL: 6.1.177-GKID-r652-8aaf08bba"
            echo "WARNING: Built from historically nearby source, not proven identical to installed kernel."
            echo "WARNING: Do not insmod/flash until symbol CRC, ABI and CFI validated against running vendor stack."
            sha256sum results/mt7601u.ko
            llvm-readelf -p .modinfo results/mt7601u.ko || true
          } > results/BUILD_REPORT.txt

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt7601u-experimental-build
          path: |
            results/
            compile.log
          if-no-files-found: warn
          retention-days: 3
