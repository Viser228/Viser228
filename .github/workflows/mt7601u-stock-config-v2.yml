name: MT7601U Wi-Fi ABI match experiment v2

on:
  push:
    paths:
      - '.github/workflows/mt7601u-stock-config-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - name: Checkout comparator
        uses: actions/checkout@v4
      - name: Prepare build dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev dwarves cpio rsync clang lld llvm gcc-aarch64-linux-gnu
      - name: Fetch GKID snapshot near r652
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch GKID-NH https://github.com/ahmed-alnassif/GKI-Duchamp-6.1.git kernel
          cd kernel
          git fetch --depth=1 origin e3b8fb598ad4e5ec0e2321e66090590882f43147
          git checkout --detach e3b8fb598ad4e5ec0e2321e66090590882f43147
          git submodule update --init --depth=1 || true
          printf 'GKID source SHA '; git rev-parse HEAD
      - name: Configure Wi-Fi exactly for known stock layout flags
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cd kernel
          make O="${GITHUB_WORKSPACE}/out" ARCH=arm64 LLVM=1 gki_defconfig
          ./scripts/config --file "${GITHUB_WORKSPACE}/out/.config" \
            -e USB -e WLAN -e WLAN_VENDOR_MEDIATEK \
            -e MAC80211_LEDS -e MAC80211_MESH \
            -m CFG80211 -m MAC80211 -m MT7601U
          make O="${GITHUB_WORKSPACE}/out" ARCH=arm64 LLVM=1 olddefconfig
          grep -E '^(CONFIG_(MT7601U|MAC80211|CFG80211|MAC80211_MESH|MAC80211_LEDS|CFI_CLANG|MODVERSIONS)=)' "${GITHUB_WORKSPACE}/out/.config"
          grep -q '^CONFIG_MT7601U=m$' "${GITHUB_WORKSPACE}/out/.config"
          grep -q '^CONFIG_MAC80211_MESH=y$' "${GITHUB_WORKSPACE}/out/.config"
          grep -q '^CONFIG_MAC80211_LEDS=y$' "${GITHUB_WORKSPACE}/out/.config"
      - name: Compile complete symbol table and module
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          make O="${GITHUB_WORKSPACE}/out" ARCH=arm64 LLVM=1 -j3 Image modules 2>&1 | tee "${GITHUB_WORKSPACE}/compile-v2.log"
          test -s "${GITHUB_WORKSPACE}/out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko"
      - name: Compare actual CRCs against stock POCO Wi-Fi
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          cp out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko results/mt7601u.ko
          cp out/.config results/build-config
          modinfo results/mt7601u.ko > results/modinfo.txt
          sha256sum results/mt7601u.ko > results/sha256.txt
          python3 tools/check_mt7601u_crc.py results/mt7601u.ko results/abi_check.json | tee results/abi_check.txt || true
          {
            echo 'EXPERIMENT ONLY. Do not insmod or flash.'
            echo 'Source: GKID-NH e3b8fb598ad4e5ec0e2321e66090590882f43147'
            echo 'Change vs v1: CONFIG_MAC80211_MESH=y CONFIG_MAC80211_LEDS=y'
            echo 'Target: POCO X6 Pro duchamp / 6.1.177 GKID-r652'
            echo 'Limitations: matching 18 Wi-Fi CRCs does NOT validate all kernel symbols, vermagic, struct offsets, CFI, or firmware.'
          } > results/README.txt
      - name: Upload research module and ABI check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt7601u-stock-config-v2-NOT-FOR-INSTALL
          path: |
            results/
            compile-v2.log
          if-no-files-found: warn
          retention-days: 3
