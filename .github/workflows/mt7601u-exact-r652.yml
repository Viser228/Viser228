name: MT7601U exact GKID r652 source compatibility

on:
  push:
    paths:
      - '.github/workflows/mt7601u-exact-r652.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-r652-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - name: Checkout ABI verifier
        uses: actions/checkout@v4
      - name: Install kernel compiler
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev dwarves cpio rsync clang lld llvm gcc-aarch64-linux-gnu
      - name: Clone EXACT GKID r652 kernel source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch GKID-NH https://github.com/ahmed-alnassif/GKI-Duchamp-6.1.git kernel
          cd kernel
          git fetch --depth=1 origin 8aaf08bba6ad4e9e53e923286a95a61b34a5df6c
          git checkout --detach 8aaf08bba6ad4e9e53e923286a95a61b34a5df6c
          git submodule update --init --depth=1 || true
          test "$(git rev-parse HEAD)" = "8aaf08bba6ad4e9e53e923286a95a61b34a5df6c"
          echo 'Exact kernel source commit verified.'
      - name: Configure GKID r652 matching stock external Wi-Fi interfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cd kernel
          make O="${GITHUB_WORKSPACE}/out" ARCH=arm64 LLVM=1 gki_defconfig
          ./scripts/config --file "${GITHUB_WORKSPACE}/out/.config" \
            --set-str LOCALVERSION '-GKID-r652-8aaf08bba' \
            -d LOCALVERSION_AUTO \
            -e USB -e WLAN -e WLAN_VENDOR_MEDIATEK \
            -e MAC80211_LEDS -e MAC80211_MESH \
            -m CFG80211 -m MAC80211 -m MT7601U
          make O="${GITHUB_WORKSPACE}/out" ARCH=arm64 LLVM=1 olddefconfig
          grep -E '^(CONFIG_(LOCALVERSION|MT7601U|MAC80211|CFG80211|MAC80211_MESH|MAC80211_LEDS|CFI_CLANG|MODVERSIONS)=)' "${GITHUB_WORKSPACE}/out/.config"
          for cfg in CONFIG_MAC80211_LEDS=y CONFIG_MAC80211_MESH=y CONFIG_MT7601U=m; do
            grep -q "^$cfg$" "${GITHUB_WORKSPACE}/out/.config"
          done
      - name: Build kernel exports and MT7601U
        shell: bash
        run: |
          set -euo pipefail
          cd kernel
          make O="${GITHUB_WORKSPACE}/out" ARCH=arm64 LLVM=1 -j3 Image modules 2>&1 | tee "${GITHUB_WORKSPACE}/compile-exact-r652.log"
          test -s "${GITHUB_WORKSPACE}/out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko"
      - name: Compare against STOCK cfg80211 and mac80211 and kernel version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          cp out/drivers/net/wireless/mediatek/mt7601u/mt7601u.ko results/mt7601u.ko
          cp out/.config results/build-config
          modinfo results/mt7601u.ko > results/modinfo.txt
          sha256sum results/mt7601u.ko > results/sha256.txt
          python3 tools/check_mt7601u_crc.py results/mt7601u.ko results/wifi-abi.json | tee results/wifi-abi.txt || true
          modinfo -F vermagic results/mt7601u.ko | tee results/vermagic.txt
          {
            echo 'EXPERIMENTAL: NOT VALIDATED ON DEVICE, DO NOT INSMOD.'
            echo 'Exact source: https://github.com/ahmed-alnassif/GKI-Duchamp-6.1/commit/8aaf08bba6ad4e9e53e923286a95a61b34a5df6c'
            echo 'Source equals short SHA in target Linux 6.1.177-GKID-r652-8aaf08bba'
            echo 'Important: running kernel KSU/SUSFS and vendor modules may have other patched ABI; CRC matching is not proof of CFI or binary compatibility.'
            echo 'Required external firmware: mt7601u.bin'
          } > results/README.txt
      - name: Upload diagnostics and experimental .ko
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt7601u-exact-r652-NOT-FOR-INSTALL
          path: |
            results/
            compile-exact-r652.log
          if-no-files-found: warn
          retention-days: 5
